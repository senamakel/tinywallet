[package]
name = "tinywallet-client"
version = "0.25.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Typed TinyBus host client for the TinyWallet module."
repository = "https://github.com/tinyhumansai/tinywallet"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
tinywallet-bus = { path = "../tinywallet-bus", default-features = false, features = ["wire"] }
tinybus.workspace = true
zeroize = "1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tinybus = { workspace = true, features = ["macros", "modules"] }

[features]
default = []
# Marker forwarded by the excluded native-E2E proof workspace. The artifact-
# gated tests stay out of ordinary workspace all-feature test and coverage runs.
native-e2e = []

[lints]
workspace = true
