name: Release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Ordinary tag release or reviewed OpenHuman epic release
        type: choice
        required: true
        default: standard
        options: [standard, reviewed-epic]
      tag:
        description: Existing version tag (vX.Y.Z) committed through a reviewed PR
        type: string
        required: true
      reviewed_pr:
        description: Positive canonical PR number for reviewed-epic mode; zero is reserved for the standard path
        type: string
        required: false
        default: '0'
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo "tag must be v-prefixed semver" >&2
            exit 2
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  module-release:
    needs: resolve
    if: github.event_name == 'push' || inputs.mode == 'standard'
    permissions:
      contents: write
    uses: tinyhumansai/.github/.github/workflows/module-release.yml@4adc1080fb495098e7af1aade82ed7e6e3c69bb7
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      module-crate: tinywallet-module

  validate-reviewed-dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reviewed-epic'
    needs: [resolve]
    permissions: {}
    outputs:
      reviewed_pr: ${{ steps.validate.outputs.reviewed_pr }}
    runs-on: ubuntu-latest
    steps:
      - id: validate
        env:
          REVIEWED_PR: ${{ inputs.reviewed_pr }}
        run: bash scripts/validate-reviewed-epic-release.sh

  module-reviewed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reviewed-epic'
    needs: [resolve, validate-reviewed-dispatch]
    permissions:
      contents: write
      pull-requests: read
      checks: read
      actions: read
    uses: tinyhumansai/.github/.github/workflows/module-reviewed-epic-release.yml@b52f22509fdf4969612ac21f225cd0d27c0b3240
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      reviewed-pr: ${{ fromJSON(needs.validate-reviewed-dispatch.outputs.reviewed_pr) }}
