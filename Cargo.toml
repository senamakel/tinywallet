[package]
name = "tinywallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Agent-friendly multi-chain wallet primitives in Rust."
repository = "https://github.com/tinyhumansai/tinywallet"
documentation = "https://docs.rs/tinywallet"
readme = "README.md"
keywords = ["wallet", "bitcoin", "solana", "ethereum", "tron"]
categories = ["cryptography::cryptocurrencies"]
# Keep the published package to what a consumer actually needs.
exclude = [
    ".github/",
    ".gitmodules",
    "docs/",
    "vendor/",
    "worktrees/",
    ".env.example",
    "deny.toml",
]

[dependencies]
# Derive macros for the crate-wide error type in `src/error/mod.rs`. Every
# dependency entry should carry a comment like this one saying why it is here.
thiserror = "2"
# Base58 (Solana) and base58check (Tron) address decoding. `check` brings in
# the checksum variant Tron addresses require.
bs58 = { version = "0.5", features = ["check"], optional = true }
# Hex codec for the Tron hex-address form the TronGrid API speaks.
hex = { version = "0.4", optional = true }
# Full Bitcoin address parsing — base58check, bech32, and the script-type
# introspection that distinguishes a P2WPKH sender from any other address
# type. Not worth hand-rolling; `no-std` off, `std` on.
bitcoin = { version = "0.32", default-features = false, features = ["std"], optional = true }
# Keccak-256, the hash EIP-55 checksums are defined over. Only needed for the
# EVM checksum helpers, so it rides its own gate rather than `evm`'s — the
# common case (validate an address) stays dependency-free.
sha3 = { version = "0.10", optional = true }

[dev-dependencies]

# The example and the public-API tests exercise every chain, so they only
# build with the full default set. Without this, a `--no-default-features`
# check fails on those targets rather than reporting the real question: does
# the library itself still compile with the gates off.
[[example]]
name = "basic"
required-features = ["btc", "evm", "solana", "tron", "keccak"]

[[test]]
name = "public_api"
required-features = ["btc", "evm", "solana", "tron", "keccak"]

[features]
default = ["btc", "evm", "solana", "tron", "keccak"]
# Bitcoin address parsing and validation.
btc = ["dep:bitcoin"]
# EVM (Ethereum and compatible chains) address validation. Dependency-free:
# an EVM address is 20 hex-encoded bytes, so the whole format is spelled out
# in `src/address/evm.rs` rather than pulling in a chain client for it.
evm = []
# Solana base58 address validation.
solana = ["dep:bs58"]
# Tron base58check address validation and hex conversion.
tron = ["dep:bs58", "dep:hex"]
# EIP-55 mixed-case checksum support for EVM addresses.
keccak = ["evm", "dep:sha3"]

# Lints apply to the whole crate and to every target. CI runs clippy with
# `-D warnings`, so anything set to "warn" here fails the build in CI.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
